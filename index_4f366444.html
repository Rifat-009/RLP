        function HeroSection() {
            const videoRef = useRef(null);
            const animationRef = useRef(null);

            const animateOpacity = (target, duration) => {
                const video = videoRef.current;
                if (!video) return;

                const start = performance.now();
                const startOpacity = video.style.opacity === '' ? 0 : parseFloat(video.style.opacity) || 0;

                const step = (timestamp) => {
                    const progress = Math.min((timestamp - start) / duration, 1);
                    const currentOpacity = startOpacity + (target - startOpacity) * progress;
                    video.style.opacity = currentOpacity.toString();

                    if (progress < 1) {
                        animationRef.current = requestAnimationFrame(step);
                    }
                };

                if (animationRef.current) {
                    cancelAnimationFrame(animationRef.current);
                }
                animationRef.current = requestAnimationFrame(step);
            };

            useEffect(() => {
                const video = videoRef.current;
                if (!video) return;

                const handleCanPlay = () => {
                    video.play();
                    animateOpacity(1, 500);
                };

                const handleTimeUpdate = () => {
                    if (video.duration && video.duration - video.currentTime <= 0.55) {
                        animateOpacity(0, 500);
                    }
                };

                const handleEnded = () => {
                    video.style.opacity = '0';
                    setTimeout(() => {
                        video.currentTime = 0;
                        video.play();
                        animateOpacity(1, 500);
                    }, 100);
                };

                video.addEventListener('canplay', handleCanPlay);
                video.addEventListener('timeupdate', handleTimeUpdate);
                video.addEventListener('ended', handleEnded);

                return () => {
                    video.removeEventListener('canplay', handleCanPlay);
                    video.removeEventListener('timeupdate', handleTimeUpdate);
                    video.removeEventListener('ended', handleEnded);
                    if (animationRef.current) {
                        cancelAnimationFrame(animationRef.current);
                    }
                };
            }, []);
